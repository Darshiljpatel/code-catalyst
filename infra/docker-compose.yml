# Local stack. Run from the repository root with --env-file .env.
x-runtime: &runtime
  DATABASE_URL: postgresql+psycopg://brandguard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/brandguard
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
  APP_ENV: ${APP_ENV:-development}
  NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
  MODEL_PRIMARY_ID: ${MODEL_PRIMARY_ID:-Qwen/Qwen3-235B-A22B-Instruct-2507}
  MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-40}
  MODEL_DAILY_RUN_LIMIT: ${MODEL_DAILY_RUN_LIMIT:-100}
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: brandguard
      POSTGRES_USER: brandguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandguard -d brandguard"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment: *runtime
    command: ["alembic", "-c", "apps/api/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    environment: *runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    restart: unless-stopped
    environment: *runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  pgdata:
