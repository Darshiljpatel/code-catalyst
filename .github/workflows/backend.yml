name: Backend integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: brandguard
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: brandguard_s1_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://brandguard:ci-only-password@localhost:5432/brandguard_s1_test
      TEST_DATABASE_URL: postgresql+psycopg://brandguard:ci-only-password@localhost:5432/brandguard_s1_test
      PYTHONPATH: apps/api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: pip install -r apps/api/requirements.lock
      - run: alembic -c apps/api/alembic.ini upgrade head
      - run: alembic -c apps/api/alembic.ini check
      - run: pytest apps/api/tests tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run build
      - run: npm --prefix apps/web run lint
      - name: Install browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Provision isolated browser database
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine
          engine = create_engine(os.environ['DATABASE_URL'], isolation_level='AUTOCOMMIT')
          with engine.connect() as conn:
              conn.exec_driver_sql("CREATE DATABASE brandguard_browser_test TEMPLATE template0 ENCODING 'UTF8'")
          engine.dispose()
          PY
      - name: Run actual browser workflow
        env:
          DATABASE_URL: postgresql+psycopg://brandguard:ci-only-password@localhost:5432/brandguard_browser_test
          PUBLIC_ORIGIN: http://localhost:5178
          APP_ENV: development
          PYTHONPATH: apps/api:packages:.
        run: |
          alembic -c apps/api/alembic.ini upgrade head
          python scripts/seed_browser_check.py
          uvicorn brandguard.main:create_app --factory --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          python -m apps.worker > "$RUNNER_TEMP/worker.log" 2>&1 &
          npm --prefix apps/web run preview -- --port 5178 > "$RUNNER_TEMP/web.log" 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for endpoint in ('http://localhost:8000/api/v1/health/ready', 'http://localhost:5178'):
              for attempt in range(30):
                  try:
                      urllib.request.urlopen(endpoint, timeout=2)
                      break
                  except OSError:
                      if attempt == 29: raise
                      time.sleep(1)
          PY
          cd apps/web
          npx playwright test
