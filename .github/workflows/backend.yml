name: Backend S1
on: [push, pull_request]
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: brandguard
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: brandguard_s1_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://brandguard:ci-only-password@localhost:5432/brandguard_s1_test
      TEST_DATABASE_URL: postgresql+psycopg://brandguard:ci-only-password@localhost:5432/brandguard_s1_test
      PYTHONPATH: apps/api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: pip install -r apps/api/requirements.lock
      - run: alembic -c apps/api/alembic.ini upgrade head
      - run: pytest apps/api/tests -q
