name: Synthetic journey
# Every 30 minutes a simulated judge opens a private demo, creates a campaign and waits for its check.
# A failure fails this workflow, which emails the repository watchers. Set the BRANDGUARD_URL
# repository variable (Settings -> Variables) to the public web origin to switch it on.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  journey:
    if: vars.BRANDGUARD_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: pip install httpx
      - run: python scripts/synthetic_journey.py "${{ vars.BRANDGUARD_URL }}" --poll-seconds 120
